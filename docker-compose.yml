services:

  postgres:
    image: postgres:16
    container_name: alltech-postgres
    environment:
      POSTGRES_DB: alltech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: pgsty/minio:latest
    container_name: alltech-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  backend:
    build:
      context: ./alltech
    container_name: alltech-backend
    depends_on:
      - postgres
      - minio
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./ginnovfront
    container_name: ginnov-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  minio_data: